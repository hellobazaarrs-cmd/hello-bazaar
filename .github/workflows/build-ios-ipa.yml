name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./nextjs_space
        run: npm install --legacy-peer-deps

      - name: Build Next.js Web App
        working-directory: ./nextjs_space
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: ./nextjs_space
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Archive iOS App
        working-directory: ./nextjs_space/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
 archive

 - name: Export IPA from Archive
 working-directory: ./nextjs_space/ios/App
 run: |
 mkdir -p ./build/Payload
 cp -r ./build/App.xcarchive/Products/Applications/App.app ./build/Payload/
 cd ./build
 zip -r ElectroBazaar.ipa Payload

 - name: Upload IPA Artifact
 uses: actions/upload-artifact@v4
 with:
 name: ElectroBazaar-iOS-IPA
 path: nextjs_space/ios/App/build/ElectroBazaar.ipa
